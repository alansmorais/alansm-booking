name: AlanSM Booking CI

on:
  push:
    branches:
      - main
      - preview
      - firebase-emulator-bootstrap
      - "feature/**"
  pull_request:
    branches:
      - main
      - preview

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install root dependencies
        run: npm install
      - name: Install Functions dependencies
        run: npm --prefix functions install
      - name: Build Cloud Functions
        run: npm run test:functions:build
      - name: Run adapter and integration tests with Firebase Emulator Suite
        run: npx --yes firebase-tools emulators:exec --project demo-alansm-booking --only auth,firestore,functions "npm test && npm run test:all-adapters"
