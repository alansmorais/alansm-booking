name: Preview CI

on:
  push:
    branches: [preview]
  pull_request:
    branches: [preview]

permissions:
  contents: read

jobs:
  emulator-tests:
    name: Firebase Emulator tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install root dependencies
        run: npm install

      - name: Install Cloud Functions dependencies
        run: npm --prefix functions install

      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - name: Run tests against isolated Firebase emulators
        run: npx --yes firebase-tools emulators:exec --project demo-alansm-booking --only auth,firestore,functions "npm test"
